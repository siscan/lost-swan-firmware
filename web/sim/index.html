<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swan split-flap simulator</title>
<!--
  Browser simulator (spec 14).  It replays traces RECORDED FROM THE REAL
  ModeManager and FrameScheduler - not a JavaScript re-implementation - so
  what this page shows is what the firmware logic actually did.

  The display itself is ../flap.js, the same widget the live web UI uses, so
  the simulator and the real page can never drift apart.

  Open directly from disk - no server needed.  The MockSocket below delivers
  the same JSON events the /ws socket pushes.

  Regenerate traces after mode/frame changes:
      build/host/gen_traces data/ring.json web/sim/traces.js
-->
<style>
  :root { --bg:#0b0f0d; --panel:#141a16; --text:#c8d2c4; --dim:#6a7a6a; --acc:#87a05a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Courier New", monospace; padding:24px; }
  h1 { font-size:16px; letter-spacing:.25em; color:var(--acc); font-weight:normal; }
  #bar { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; align-items:center; }
  button { background:var(--panel); color:var(--text); border:1px solid #2c352c;
           font:inherit; padding:6px 12px; cursor:pointer; }
  button.active, button:hover { border-color:var(--acc); color:var(--acc); }
  #display { display:flex; gap:14px; margin:26px 0; justify-content:center; }
  .flap-gap { width:26px; }
  .flap-col { width:110px; height:150px; perspective:400px; }
  .flap-card { width:100%; height:100%; border-radius:6px; display:flex; align-items:center;
               justify-content:center; font-size:64px; font-weight:bold; position:relative;
               box-shadow:0 4px 14px #0009, inset 0 -1px 0 #fff2;
               transition:transform 40ms linear; }
  .flap-card::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px;
                      background:#0007; }
  .flap-card.small { font-size:20px; letter-spacing:.05em; text-transform:uppercase; }
  .flap-card.flip { transform:scaleY(.12); }
  #status { display:flex; gap:22px; color:var(--dim); font-size:13px; min-height:20px; }
  #cue { color:#d8b04a; } #skip { color:var(--dim); } #modelbl { color:var(--acc); }
  #desc { color:var(--dim); font-size:13px; margin-top:4px; }
</style>
</head>
<body>
<h1>DHARMA · SWAN · SPLIT-FLAP SIMULATOR</h1>
<div id="desc"></div>
<div id="bar"></div>
<div id="display"></div>
<div id="status">
  <span id="modelbl"></span><span id="clock"></span><span id="cue"></span><span id="skip"></span>
</div>
<script src="traces.js"></script>
<script src="../flap.js"></script>
<script>
"use strict";
const TRACES = window.SWAN_TRACES;
const disp = new SwanFlap.FlapDisplay(document.getElementById("display"),
                                      window.SWAN_RING, { gapAfter: 2 });

// --- MockSocket: replays a trace with the /ws message shape ---------------
// Long idle gaps are compressed to keep the replay watchable; the skip chip
// shows how much simulated time was jumped.
class MockSocket {
  constructor(trace) { this.trace = trace; this.onmessage = null; this.stop = false; }
  close() { this.stop = true; }
  run() {
    const ev = this.trace.events;
    let i = 0, simT = 0;
    const step = () => {
      if (this.stop || i >= ev.length) return;
      const gap = ev[i].t - simT;
      const wait = Math.min(gap, 1500);
      if (gap > 1500) skipLbl.textContent = "⏩ +" + Math.round((gap - wait) / 1000) + "s";
      else skipLbl.textContent = "";
      simT = ev[i].t;
      setTimeout(() => {
        if (this.stop) return;
        this.onmessage({ data: JSON.stringify(ev[i]) });
        i += 1;
        step();
      }, wait);
    };
    step();
  }
}

// --- wiring ----------------------------------------------------------------
const modeLbl = document.getElementById("modelbl"), cueLbl = document.getElementById("cue"),
      skipLbl = document.getElementById("skip"), descLbl = document.getElementById("desc");
let sock = null;
function play(name) {
  if (sock) sock.close();
  disp.reset();
  cueLbl.textContent = ""; skipLbl.textContent = ""; modeLbl.textContent = "";
  descLbl.textContent = TRACES[name].desc;
  document.querySelectorAll("#bar button").forEach(b =>
      b.classList.toggle("active", b.dataset.n === name));
  sock = new MockSocket(TRACES[name]);
  // The same switch app.js runs against the live socket.
  sock.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.e === "go") disp.flipTo(e.col, e.idx, e.flaps);
    else if (e.e === "spin") disp.spin(e.col, e.flaps, e.secs);
    else if (e.e === "mode") modeLbl.textContent = "mode: " + e.name;
    else if (e.e === "cue") {
      cueLbl.textContent = "♪ " + e.name;
      setTimeout(() => { cueLbl.textContent = ""; }, 2500);
    }
  };
  sock.run();
}
const bar = document.getElementById("bar");
for (const name of Object.keys(TRACES)) {
  const b = document.createElement("button");
  b.textContent = name; b.dataset.n = name;
  b.onclick = () => play(name);
  bar.appendChild(b);
}
play(Object.keys(TRACES)[0]);
</script>
</body>
</html>
