<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOST Swan · Setup</title>
<!--
  The captive-portal page (spec 10.1).

  Deliberately standalone and tiny: it is served to a phone that has joined an
  open access point and has NO internet, so it can reference nothing external,
  and it is the one page that must work when everything else about the network
  has failed. No glyphs, no ring, no WebSocket - just the two fields.
-->
<style>
  :root { --bg:#0b0f0d; --panel:#141a16; --text:#c8d2c4; --dim:#6a7a6a;
          --acc:#87a05a; --bad:#b03a2e; --edge:#2c352c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); padding:22px 18px;
         font-family:"Courier New", ui-monospace, monospace; line-height:1.5; }
  main { max-width: 27rem; margin: 0 auto; }
  h1 { font-size:15px; letter-spacing:.28em; color:var(--acc); font-weight:normal;
       margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 22px; letter-spacing:.08em; }
  label { display:block; font-size:12px; letter-spacing:.1em; color:var(--dim);
          margin:16px 0 5px; }
  input { width:100%; background:var(--panel); color:var(--text);
          border:1px solid var(--edge); font:inherit; font-size:16px; padding:11px 12px; }
  input:focus { outline:none; border-color:var(--acc); }
  button { width:100%; margin-top:22px; background:var(--panel); color:var(--acc);
           border:1px solid var(--acc); font:inherit; font-size:15px;
           letter-spacing:.18em; padding:13px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  #msg { margin-top:16px; font-size:13px; min-height:3.2em; }
  #msg.bad { color:var(--bad); }
  #msg.ok { color:var(--acc); }
  .note { color:var(--dim); font-size:12px; margin-top:26px;
          border-top:1px solid var(--edge); padding-top:14px; }
</style>

<main>
  <h1>DHARMA · SWAN · STATION 3</h1>
  <p class="sub">network setup</p>

  <form id="f">
    <label for="ssid">NETWORK NAME</label>
    <!-- No autocorrect or capitalisation: an SSID is case-sensitive and a
         phone keyboard will happily "fix" it into something that never joins. -->
    <input id="ssid" name="ssid" autocomplete="off" autocapitalize="none"
           autocorrect="off" spellcheck="false" maxlength="32" required>

    <label for="pass">PASSWORD</label>
    <input id="pass" name="pass" type="password" autocomplete="off"
           autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="63">

    <button id="go" type="submit">SAVE AND JOIN</button>
  </form>

  <div id="msg"></div>

  <p class="note">
    The display stays on this network until it joins yours, so if the password
    is wrong you can simply try again here — you will not be locked out. It
    keeps working as a clock throughout.
  </p>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function say(text, cls) {
  const m = $("msg");
  m.textContent = text;
  m.className = cls || "";
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ssid = $("ssid").value.trim();
  if (!ssid) { say("Enter a network name.", "bad"); return; }

  $("go").disabled = true;
  say("Saving…");
  try {
    // The one dispatcher, same as every other control path.
    const r = await fetch("/api/cmd", {
      method: "POST",
      body: JSON.stringify({ cmd: "wifi.credentials",
                             payload: { ssid, pass: $("pass").value } }),
    }).then((x) => x.json());
    if (!r.ok) { say(r.err || "Rejected.", "bad"); $("go").disabled = false; return; }
  } catch (_) {
    say("Could not reach the display. Are you still on its network?", "bad");
    $("go").disabled = false;
    return;
  }

  // The access point stays up until the STA actually joins, so this page keeps
  // working while we watch - and if the password was wrong, the form comes
  // back rather than the display vanishing.
  say("Saved. Trying to join " + ssid + "…");
  const started = Date.now();
  const poll = setInterval(async () => {
    let s = null;
    try {
      s = await fetch("/api/state", { cache: "no-store" }).then((x) => x.json());
    } catch (_) {
      // The AP going away IS success: the display joined and took the portal
      // down, which is the last thing it does.
      clearInterval(poll);
      say("Joined. The display is on your network now — find it at lost.local. "
          + "You can leave this page.", "ok");
      return;
    }
    if (s.sys && s.sys.wifi === "connected" && s.sys.ip) {
      clearInterval(poll);
      say("Joined. The display is at " + s.sys.ip + " (lost.local).", "ok");
      return;
    }
    if (Date.now() - started > 45000) {
      clearInterval(poll);
      say("It has not joined after 45 seconds — the password is probably wrong, "
          + "or the network is out of range. Check and try again.", "bad");
      $("go").disabled = false;
    }
  }, 2000);
});
</script>
