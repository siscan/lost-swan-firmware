# CI - the reliability source of truth (Linux; no Smart App Control, no ar.exe
# block).  The Windows dev machine's SAC-retry in test-host.ps1 is local
# convenience only.
#
# Jobs:
#   ring-table  - the committed generated header must match the manifest
#   host-tests  - native build of the pure-logic suites, incl. the
#                 simulated-axis suite (Phase 1.5), plus the mirror widget's
#                 JS suite (node, no npm - the DOM is faked in the test file)
#   firmware    - both board maps, in Espressif's official IDF v5.5.5 image
#   release-gate - a release image must NOT be able to ship with simulated
#                 axes compiled in.  Proves both halves: SWAN_RELEASE=1 with
#                 the sim still on FAILS at configure time, and with it off
#                 builds clean.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ring-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generated ring table is current
        run: python3 tools/ringgen.py --check

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S test/host -B build_host
      - name: Build
        run: cmake --build build_host
      - name: Run
        run: ctest --test-dir build_host --output-on-failure
      # A syntax error in any of these kills the WHOLE page - the browser stops
      # at the first one and every control on it is dead.  It cost a flash cycle
      # to find that by hand once (`let audio` declared twice in terminal.js);
      # node parses all four in under a second.
      - name: Web scripts parse
        run: |
          for f in web/*.js; do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      - name: Mirror widget (node, faked DOM, virtual clock)
        run: node test/host/test_flap.js
      - name: Countdown rendering contract (spec 7.3, the JS port)
        run: node test/host/test_countdown.js
      - name: Swan mark trigram ring (docs/ref/swan_trigrams.md)
        run: node test/host/test_logo.js
      - name: Toggle matrix (content and presentation are orthogonal)
        run: node test/host/test_toggles.js

  # The stand-in bench image (BRINGUP 28b gate 3).  Built in CI because its
  # whole value is a cap that cannot be configured away, and a cap that stops
  # compiling is a cap that is not there.
  bench-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
      - name: A bench image builds, and says it is one
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py -B build_bench -DSWAN_BOARD=devkitc1 -DSWAN_BENCH=ON set-target esp32c5
          idf.py -B build_bench -DSWAN_BOARD=devkitc1 -DSWAN_BENCH=ON build
          # Assert on the ARTIFACT, not on log text: the version banner is
          # printed at configure time, so grepping a `build` that had nothing to
          # reconfigure fails for the wrong reason.  project_description.json is
          # what the image was actually stamped with.
          v=$(python -c "import json;print(json.load(open('build_bench/project_description.json'))['project_version'])")
          echo "built version: $v"
          test "$v" = "0.4.0+devkitc1.bench"
      - name: A bench image is not a release image
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          if idf.py -B build_bench_rel -DSWAN_BENCH=ON -DSWAN_RELEASE=1                     -DSWAN_SIM_AXES=OFF reconfigure; then
            echo "FAIL: SWAN_BENCH=1 with SWAN_RELEASE=1 configured cleanly"
            exit 1
          fi
          echo "gate fired as expected"
      - name: Simulator traces are current
        run: |
          ./build_host/gen_traces data/ring.json /tmp/traces.js
          diff /tmp/traces.js web/sim/traces.js

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [devkitc1, xiao]
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
      - name: Build (${{ matrix.board }})
        shell: bash
        run: |
          # The runner checks out as a different uid than the container user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py -DSWAN_BOARD=${{ matrix.board }} set-target esp32c5
          idf.py -DSWAN_BOARD=${{ matrix.board }} build
      - name: Size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size

  release-gate:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
      - name: A release image cannot carry simulated axes
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py -B build_gate -DSWAN_BOARD=devkitc1 set-target esp32c5
          # The gate must FIRE: SWAN_RELEASE=1 with the simulation still
          # compiled in is a configure-time FATAL_ERROR, not a warning.
          if idf.py -B build_gate -DSWAN_BOARD=devkitc1 \
                    -DSWAN_RELEASE=1 -DSWAN_SIM_AXES=ON reconfigure; then
            echo "FAIL: SWAN_RELEASE=1 with SWAN_SIM_AXES=ON configured cleanly"
            exit 1
          fi
          echo "gate fired as expected"
      - name: ... and a real release build is clean
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          rm -rf build_release
          idf.py -B build_release -DSWAN_BOARD=devkitc1 set-target esp32c5
          idf.py -B build_release -DSWAN_BOARD=devkitc1 \
                 -DSWAN_RELEASE=1 -DSWAN_SIM_AXES=OFF build
