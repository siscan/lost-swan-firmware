<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Bench bill of materials</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">Every physical object the session needs. Tick it, then start.</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">1 / 28</text>
<rect x="52" y="108" width="1496" height="72" rx="6" fill="#eff8f2" stroke="#1a7f45" stroke-width="3"/>
<rect x="52" y="108" width="9" height="72" rx="0" fill="#1a7f45" stroke="none" stroke-width="2"/>
<text x="80" y="140" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#1a7f45" text-anchor="start" font-weight="bold">NOTHING HERE NEEDS ACQUIRING. Every item was confirmed on hand on 2026-09-11, the 830-point breadboard included. This box exists so that anything</text>
<text x="80" y="164" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#1a7f45" text-anchor="start" font-weight="bold">a later revision adds lands on page 1 rather than being discovered on page 13.</text>
<rect x="52" y="236" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="252" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="272" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">TMC2209 StepStick (FYSETC)</text>
<text x="772" y="272" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1 of 6</text>
<text x="110" y="298" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">The driver. Headers arrived PRE-SOLDERED, confirmed by opening the box, so page 5 is</text>
<text x="110" y="316" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">a skip. All six are one revision, so one Vref carries to all five later.</text>
<rect x="52" y="336" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="352" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="372" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">ESP32-C5-DevKitC-1</text>
<text x="772" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="110" y="398" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Already on the bench. It stays OFF the breadboard - page 7 says why - so every wire</text>
<text x="110" y="416" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">that reaches it is male-to-female.</text>
<rect x="52" y="436" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="452" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="472" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">NEMA 17 + printed stand-in axle</text>
<text x="772" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="110" y="498" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">The load. The axle is PLA, which is why the firmware clamps every commanded speed to</text>
<text x="110" y="516" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">one drum revolution per second and why that cap is not configurable.</text>
<rect x="52" y="536" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="552" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="572" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Breadboard, full-size 830-point</text>
<text x="772" y="572" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="110" y="598" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">63 rows, two rail pairs, an 0.3 in centre channel. The channel is the only reason a</text>
<text x="110" y="616" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">StepStick works on a breadboard at all - page 7.</text>
<rect x="52" y="636" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="652" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="672" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Jumper wires, male-to-FEMALE</text>
<text x="772" y="672" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">5</text>
<text x="110" y="698" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Three signals (STEP, DIR, EN) and the two rail feeds. Female onto the ESP32's pins,</text>
<text x="110" y="716" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">male into the board.</text>
<rect x="52" y="736" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="752" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="772" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Jumper wires, male-to-male</text>
<text x="772" y="772" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">4</text>
<text x="110" y="798" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Board-internal only: VIO, GND (logic), MS1 and MS2 to the rails. Both counts are</text>
<text x="110" y="816" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">derived from the parsed connection table, not typed on this page.</text>
<rect x="52" y="836" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="852" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="872" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">JST-XH 4-way mating pigtail</text>
<text x="772" y="872" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="110" y="898" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">THE MOTOR PLUG CANNOT ENTER A BREADBOARD. The pigtail's four flying leads can. Page</text>
<text x="110" y="916" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">2 shows exactly where they terminate.</text>
<rect x="52" y="936" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="68" y="952" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="110" y="972" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">100 uF electrolytic, 35 V or more</text>
<text x="772" y="972" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="110" y="998" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">The bulk capacitor. Its legs need trimming and bending before it will reach the</text>
<text x="110" y="1016" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">right two holes - lead prep on page 2.</text>
<rect x="812" y="236" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="252" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="272" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Hookup wire, 22 AWG SOLID core</text>
<text x="1532" y="272" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">30 cm red + black</text>
<text x="870" y="298" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">RotoPD screw terminal to the board. Solid, not stranded: stranded frays in a</text>
<text x="870" y="316" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">breadboard hole, will not hold, and leaves a strand behind.</text>
<rect x="812" y="336" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="352" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="372" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Flat screwdriver, 2 mm blade</text>
<text x="1532" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="870" y="398" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Two jobs: the RotoPD's screw terminals, and the Vref trimpot on page 23. A blade</text>
<text x="870" y="416" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">that does not fit the pot slips off it onto a pad.</text>
<rect x="812" y="436" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="452" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="472" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Multimeter with a continuity beep</text>
<text x="1532" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="870" y="498" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Coil pairs (page 8), continuity (page 22), Vref (page 23). Continuity and DC volts</text>
<text x="870" y="516" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">on a 2 V range are the only functions used.</text>
<rect x="812" y="536" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="552" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="572" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">USB-C cable, PC to ESP32</text>
<text x="1532" y="572" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="870" y="598" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Console and logic power. A DATA cable - a charge-only lead gives a board that powers</text>
<text x="870" y="616" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">up, looks alive, and never appears as a serial port.</text>
<rect x="812" y="636" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="652" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="672" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">USB-C PD cable + RotoPD trigger</text>
<text x="1532" y="672" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="870" y="698" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">VM. 9 V while the wiring is being proven, then 20 V before the soak, from the same</text>
<text x="870" y="716" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">trigger board.</text>
<rect x="812" y="736" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="752" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="772" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Hex key for the drum set screw</text>
<text x="1532" y="772" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">1</text>
<text x="870" y="798" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Fit the stand-in drum, and MARK it - a tape flag will do - so that `step 0 3200` is</text>
<text x="870" y="816" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">a readable result rather than a guess.</text>
<rect x="812" y="836" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="852" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="872" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Heatsink (supplied, loose)</text>
<text x="1532" y="872" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">0  -  NOT this session</text>
<text x="870" y="898" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Deliberately not installed. Page 2 has the reasoning and the one condition that</text>
<text x="870" y="916" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">would change it.</text>
<rect x="812" y="936" width="736" height="92" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<rect x="828" y="952" width="26" height="26" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="870" y="972" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">Hall sensor + magnet</text>
<text x="1532" y="972" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#6b7683" text-anchor="end" font-weight="normal">0  -  NOT this session</text>
<text x="870" y="998" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">Branch B: no Hall fitted, so no homing, no edge figures, no revs. That is the</text>
<text x="870" y="1016" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">expected configuration for this session and not a fault.</text>
