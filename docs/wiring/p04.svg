<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131">
<rect width="1600" height="1131" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="88" fill="#eef1f4"/>
<line x1="0" y1="88" x2="1600" y2="88" stroke="#c7ced6" stroke-width="2"/>
<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Three ways to kill the driver</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">Read before you pick anything up</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">4 / 28</text>
<rect x="52" y="132" width="1496" height="176" rx="8" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="132" width="10" height="176" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<circle cx="116" cy="192" r="32" fill="#c0261b" stroke="none" stroke-width="1"/>
<text x="116" y="203" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="174" y="182" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="24" fill="#c0261b" text-anchor="start" font-weight="bold">NEVER connect or disconnect the motor while VM is live.</text>
<text x="174" y="220" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">An open coil on a live driver dumps its stored energy into the output stage. This kills more StepSticks than</text>
<text x="174" y="246" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">every other cause put together. Power down FIRST, then touch the motor plug — every time, including 'just for a</text>
<text x="174" y="272" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">second'.</text>
<rect x="52" y="328" width="1496" height="176" rx="8" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="328" width="10" height="176" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<circle cx="116" cy="388" r="32" fill="#c0261b" stroke="none" stroke-width="1"/>
<text x="116" y="399" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="174" y="378" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="24" fill="#c0261b" text-anchor="start" font-weight="bold">NEVER insert or remove the driver module while VM is live.</text>
<text x="174" y="416" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">Same physics, and you will bridge something on the way past as well.</text>
<rect x="52" y="524" width="1496" height="176" rx="8" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="524" width="10" height="176" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<circle cx="116" cy="584" r="32" fill="#c0261b" stroke="none" stroke-width="1"/>
<text x="116" y="595" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="174" y="574" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="24" fill="#c0261b" text-anchor="start" font-weight="bold">Set Vref BEFORE the motor is ever connected.</text>
<text x="174" y="612" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">Vref sets the coil current. Set it with the motor attached and the first thing your motor sees is wherever the</text>
<text x="174" y="638" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">pot happened to be when it left the factory — often well over 1.5 A. This guide sets Vref on page 17 and</text>
<text x="174" y="664" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">connects the motor on pages 24-25, in that order, deliberately.</text>
<text x="52" y="760" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">And one that is less dramatic but more common</text>
<text x="52" y="794" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">The bulk capacitor must sit at the driver's OWN VM and GND pins — not on a breadboard rail at the</text>
<text x="52" y="820" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">far end of the board. Page 19 shows where.</text>
<text x="52" y="866" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#1a7f45" text-anchor="start" font-weight="normal">If you are unsure at any point: power off, and nothing you do next can break anything. Every</text>
<text x="52" y="891" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#1a7f45" text-anchor="start" font-weight="normal">irreversible mistake in this guide needs VM to be live.</text>
<line x1="52" y1="1087" x2="1548" y2="1087" stroke="#c7ced6" stroke-width="1" stroke-linecap="round"/>
<text x="52" y="1111" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">LOST Swan  module V1  ·  generated by tools/wiringgen.py from hal/pins.h + docs/BENCH_WIRING.md</text>
</svg>