<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131">
<rect width="1600" height="1131" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="88" fill="#eef1f4"/>
<line x1="0" y1="88" x2="1600" y2="88" stroke="#c7ced6" stroke-width="2"/>
<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Set Vref  —  0.7 A</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">Motor disconnected. VM off. USB on. Driver NOT inserted.</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">24 / 29</text>
<rect x="52" y="104" width="1496" height="74" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="104" width="9" height="74" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="136" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">THE DRIVER IS NOT IN THE BREADBOARD FOR THIS PAGE. It seats pot-down (page 7), so once it is in, the pot is against the board and</text>
<text x="80" y="161" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">unreachable. Set it lying on the bench on two flying leads, write the number down, and insert it already correct.</text>
<rect x="90" y="200" width="520" height="388" rx="8" fill="#f6f8fa" stroke="#14181d" stroke-width="3"/>
<text x="350" y="184" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#6b7683" text-anchor="middle" font-weight="normal">driver, close up</text>
<circle cx="240" cy="350" r="58" fill="#dfe4ea" stroke="#14181d" stroke-width="3"/>
<line x1="202" y1="350" x2="278" y2="350" stroke="#14181d" stroke-width="7" stroke-linecap="round"/>
<text x="240" y="436" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="middle" font-weight="bold">Vref trimpot</text>
<text x="240" y="458" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="14" fill="#6b7683" text-anchor="middle" font-weight="normal">(the screw head IS the wiper)</text>
<line x1="240" y1="350" x2="420" y2="260" stroke="#d0342c" stroke-width="9" stroke-linecap="round"/>
<circle cx="240" cy="350" r="9" fill="#d0342c" stroke="none" stroke-width="1"/>
<text x="430" y="254" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#d0342c" text-anchor="start" font-weight="bold">RED probe</text>
<text x="430" y="276" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="14" fill="#6b7683" text-anchor="start" font-weight="normal">on the wiper</text>
<rect x="114" y="500" width="120" height="28" rx="3" fill="#9aa4ae" stroke="#14181d" stroke-width="2"/>
<text x="174" y="520" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#14181d" text-anchor="middle" font-weight="bold">GND</text>
<polyline points="234,514 300,514 420,396" fill="none" stroke="#22262b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="234" cy="514" r="9" fill="#22262b" stroke="none" stroke-width="1"/>
<text x="430" y="390" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#22262b" text-anchor="start" font-weight="bold">BLACK probe</text>
<text x="430" y="412" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="14" fill="#6b7683" text-anchor="start" font-weight="normal">on any GND pin</text>
<rect x="90" y="600" width="520" height="120" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="90" y="600" width="9" height="120" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="118" y="632" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">If your module has a labelled VREF pad, use</text>
<text x="118" y="656" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">that instead of the screw. Use a CLIP, not a</text>
<text x="118" y="680" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">hand-held probe: one slip from the wiper to a</text>
<text x="118" y="704" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">neighbouring pad kills the driver.</text>
<text x="700" y="246" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">1.  Read your sense resistor (page 6)</text>
<rect x="700" y="266" width="840" height="128" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<text x="724" y="296" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="bold">marking</text>
<text x="934" y="296" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="bold">R_sense</text>
<text x="1144" y="296" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="bold">full scale</text>
<text x="1354" y="296" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="bold">Vref for 0.7 A</text>
<text x="724" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">R110</text>
<text x="934" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">0.11 ohm</text>
<text x="1144" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">1.77 A</text>
<text x="1354" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="bold">0.99 V</text>
<text x="724" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">R150</text>
<text x="934" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">0.15 ohm</text>
<text x="1144" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">1.35 A</text>
<text x="1354" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#14181d" text-anchor="start" font-weight="bold">1.29 V</text>
<text x="700" y="428" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">2.  VIO and GND on flying leads ONLY.  USB in.</text>
<text x="700" y="462" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">3.  Meter to DC volts, 2 V range. Black on GND.</text>
<text x="700" y="496" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">4.  Turn the pot in small steps; set the figure above.</text>
<text x="700" y="544" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">Vref set  =</text>
<line x1="880" y1="550" x2="1240" y2="550" stroke="#14181d" stroke-width="2" stroke-linecap="round"/>
<text x="1252" y="544" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="normal">V</text>
<text x="700" y="574" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#c0261b" text-anchor="start" font-weight="bold">write it down NOW - it is unreadable once the module is seated</text>
<text x="700" y="608" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">The pot is sensitive — a few degrees is 0.1 V. Creep</text>
<text x="700" y="632" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">up on the number; do not sweep past it and come back.</text>
<text x="700" y="672" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">0.99 V is 0.7 A RMS on an R110 module. The A4988</text>
<text x="700" y="696" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">formula would say 0.19 V and give you about 0.14 A — a</text>
<text x="700" y="720" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">motor that skips under load and looks too small for</text>
<text x="700" y="744" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">the job.</text>
<rect x="52" y="730" width="1496" height="2" rx="0" fill="#c7ced6" stroke="none" stroke-width="2"/>
<text x="52" y="776" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">The TMC2209 uses VREF as a SCALING input against a full-scale current fixed by the sense resistor — it</text>
<text x="52" y="802" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">is not the A4988 formula, and using that one gives about 0.14 A, at which the motor skips under load and</text>
<text x="52" y="828" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">looks inadequate. The equation these numbers come from:</text>
<text x="52" y="890" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" fill="#14181d" text-anchor="start" font-weight="bold">I_RMS  =  [ 0.325 / (R_sense + 0.02) ] / sqrt(2)  x  ( Vref / 2.5 )</text>
<rect x="52" y="916" width="1000" height="74" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="916" width="9" height="74" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="948" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">MOTOR DISCONNECTED for this whole page. That is rule 3 on page 4: set the current before</text>
<text x="80" y="973" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">the motor can be subjected to it.</text>
<line x1="52" y1="1087" x2="1548" y2="1087" stroke="#c7ced6" stroke-width="1" stroke-linecap="round"/>
<text x="52" y="1111" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">LOST Swan  module V1  ·  generated by tools/wiringgen.py from hal/pins.h + docs/BENCH_WIRING.md</text>
</svg>