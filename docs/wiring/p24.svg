<text x="52" y="776" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">Both ends of ONE coil — the pair you found on page 8 — go to 1A and 1B. Which of the two ends goes to</text>
