<text x="1206" y="368" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#1f8a4c" text-anchor="start" font-weight="bold">OUT</text>
<text x="1010" y="426" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">THE OUTPUT IS OPEN DRAIN. It can pull the line</text>
<text x="1010" y="449" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">down and it cannot pull it up, so with no</text>
<text x="1010" y="472" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">resistor the GPIO floats and `hall` reads noise.</text>
<text x="1010" y="495" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">This is the one wire in the guide that is a</text>
<text x="1010" y="518" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">component rather than a jumper.</text>
<text x="1010" y="575" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="bold">And 0.1 uF at the sensor</text>
<text x="1010" y="609" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">Across VCC and GND, at the sensor end of the</text>
<text x="1010" y="632" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">flying leads. The datasheet: "strongly</text>
<text x="1010" y="655" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">recommended ... in close proximity to the Hall</text>
<text x="1010" y="678" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">element". The leads are long and the drivers are</text>
<text x="1010" y="701" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">switching a metre away.</text>
