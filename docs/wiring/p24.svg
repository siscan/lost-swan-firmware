<rect x="1060" y="818" width="9" height="139" rx="0" fill="#b8791a" stroke="none" stroke-width="2"/>
<text x="1088" y="850" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">THE SENSOR IS NOT ON THE BREADBOARD. It is on</text>
<text x="1088" y="873" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">the module, on flying leads, so it has no row</text>
<text x="1088" y="896" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">and column - which is also why this page</text>
<text x="1088" y="919" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">carries no layout caveat: there is no layout</text>
