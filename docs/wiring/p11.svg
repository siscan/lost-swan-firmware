<text x="52" y="776" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">Microstep select, bit two. Tie it HIGH as well. BOTH high is 1/16 on a TMC2209, and the table is not in</text>
<text x="52" y="804" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">a sensible order — which is exactly why this one is easy to get wrong.</text>
<rect x="52" y="848" width="1000" height="99" rx="6" fill="#fdf7ec" stroke="#b8791a" stroke-width="3"/>
<rect x="52" y="848" width="9" height="99" rx="0" fill="#b8791a" stroke="none" stroke-width="2"/>
<text x="80" y="880" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">Modules usually pull MS1 and MS2 LOW on board. Leave them unconnected and you get 1/8,</text>
<text x="80" y="905" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">which makes every constant in the firmware wrong by a factor of two. Page 20 has a</text>
<text x="80" y="930" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">mechanical check that proves the setting — do not trust the jumper.</text>
<text x="960" y="250" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="bold">TMC2209 microstep table</text>
