<text x="844" y="690" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">The motor keeps its own colours: red, blue, green, black.</text>
<text x="844" y="718" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">Use any wire you like — but be consistent, and</text>
<text x="844" y="742" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="bold">never use red or black for a signal.</text>
