<text x="1200" y="212" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">RED, thick</text>
<line x1="858" y1="247" x2="950" y2="247" stroke="#22262b" stroke-width="11" stroke-linecap="round"/>
<text x="970" y="253" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">GND  (power)</text>
<text x="1200" y="253" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">BLACK, thick</text>
<line x1="858" y1="288" x2="950" y2="288" stroke="#d0342c" stroke-width="6" stroke-linecap="round"/>
<text x="970" y="294" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">VIO  -&gt;  3V3</text>
<text x="1200" y="294" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">red, thin</text>
<line x1="858" y1="329" x2="950" y2="329" stroke="#22262b" stroke-width="6" stroke-linecap="round"/>
<text x="970" y="335" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">GND  (logic)</text>
<text x="1200" y="335" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">black, thin</text>
<line x1="858" y1="370" x2="950" y2="370" stroke="#e07b16" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="376" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">STEP</text>
<text x="1200" y="376" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">orange</text>
<line x1="858" y1="411" x2="950" y2="411" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="417" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">DIR</text>
<text x="1200" y="417" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">yellow</text>
<line x1="858" y1="452" x2="950" y2="452" stroke="#7b8794" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="458" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">EN</text>
<text x="1200" y="458" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">white / grey</text>
<line x1="858" y1="493" x2="950" y2="493" stroke="#7d4bbf" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="499" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">MS1</text>
<text x="1200" y="499" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">violet</text>
<line x1="858" y1="534" x2="950" y2="534" stroke="#4a7fa5" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="540" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">MS2</text>
<text x="1200" y="540" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">grey-blue</text>
<line x1="858" y1="575" x2="950" y2="575" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round"/>
<text x="970" y="581" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">PDN</text>
<text x="1200" y="581" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">brown</text>
<text x="844" y="648" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">The motor keeps its own colours: red, blue, green, black.</text>
<text x="844" y="676" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">Use any wire you like — but be consistent, and</text>
<text x="844" y="700" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="bold">never use red or black for a signal.</text>
<line x1="52" y1="1087" x2="1548" y2="1087" stroke="#c7ced6" stroke-width="1" stroke-linecap="round"/>
