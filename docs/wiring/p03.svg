<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Bench wiring — module V1</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">First power-on, connection by connection</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">3 / 32</text>
<text x="52" y="148" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">The whole job in 32 pages, in the order you should do it. One</text>
<text x="52" y="176" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">connection per page. Every pin number here is read out of</text>
<text x="52" y="204" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">hal/pins.h and docs/BENCH_WIRING.md when these pages are</text>
<text x="52" y="232" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">rendered, so a drawing cannot quietly disagree with the</text>
<text x="52" y="260" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">firmware. Row and column numbers are a different kind of</text>
<text x="52" y="288" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">statement - page 2 says which.</text>
<rect x="52" y="330" width="720" height="128" rx="6" fill="#eff8f2" stroke="#1a7f45" stroke-width="3"/>
<rect x="52" y="330" width="9" height="128" rx="0" fill="#1a7f45" stroke="none" stroke-width="2"/>
<text x="80" y="362" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#1a7f45" text-anchor="start" font-weight="bold">THE HALL SENSOR AND MAGNET ARE FITTED (2026-09-20). This</text>
<text x="80" y="388" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#1a7f45" text-anchor="start" font-weight="bold">module homes, so pages 23-25 are new and everything after</text>
<text x="80" y="414" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#1a7f45" text-anchor="start" font-weight="bold">them can be closed loop. Gate 3 ran without them and every</text>
<text x="80" y="440" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#1a7f45" text-anchor="start" font-weight="bold">page said so.</text>
<rect x="52" y="474" width="720" height="76" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="474" width="9" height="76" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="506" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">READ PAGE 4 FIRST. The three rules on it are how TMC2209</text>
<text x="80" y="532" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">drivers die.</text>
<text x="52" y="610" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">THE ORDER, and why it is this order</text>
<text x="60" y="640" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">1-2</text>
<text x="148" y="640" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">collect the parts, and prepare three of them</text>
<text x="60" y="668" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">3-5</text>
<text x="148" y="668" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">the rules, and the one solder job (skipped)</text>
<text x="60" y="696" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">6-9</text>
<text x="148" y="696" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">identify the parts, the board, the coil pairs</text>
<text x="60" y="724" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">10-14</text>
<text x="148" y="724" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">wire the logic  (driver to ESP32)</text>
<text x="60" y="752" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">15-19</text>
<text x="148" y="752" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">wire the microsteps, then the power</text>
<text x="60" y="780" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">20-22</text>
<text x="148" y="780" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">the bulk capacitor, then the board as BUILT</text>
<text x="60" y="808" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">23-25</text>
<text x="148" y="808" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">the Hall sensor  &lt;-  and PROVE its polarity</text>
<text x="60" y="836" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">26</text>
<text x="148" y="836" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">continuity check  &lt;-  find mistakes with a meter</text>
<text x="60" y="864" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">27</text>
<text x="148" y="864" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">set Vref  &lt;-  motor still NOT connected</text>
<text x="60" y="892" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">28-29</text>
<text x="148" y="892" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#14181d" text-anchor="start" font-weight="bold">connect the motor  &lt;-  power off while you do it</text>
<text x="60" y="920" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">30-32</text>
<text x="148" y="920" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">finished layout, the built board, power on / off</text>
<text x="850" y="148" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">WIRE COLOURS — the same on every page</text>
