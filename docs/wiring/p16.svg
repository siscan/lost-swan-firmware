<text x="1090" y="786" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="bold">ON THE BOARD</text>
<line x1="1090" y1="798" x2="1528" y2="798" stroke="#c7ced6" stroke-width="2" stroke-linecap="round"/>
<text x="1090" y="830" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">PDN is row 29 column D. NOTHING goes in row</text>
<text x="1090" y="853" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">29. Leave the whole row empty.</text>
<text x="1090" y="892" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">ROW AND COLUMN NUMBERS ARE LAYOUT, NOT CHECKED FACTS. The</text>
<text x="1090" y="909" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">pins on this page are parsed from hal/pins.h and</text>
<text x="1090" y="926" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">BENCH_WIRING.md and cross-checked; no source says which</text>
<text x="1090" y="943" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">HOLE anything sits in, so nothing verifies that. Build it</text>
<text x="1090" y="960" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">elsewhere on the board and the electrical pages are still</text>
<text x="1090" y="977" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#6b7683" text-anchor="start" font-weight="normal">true while these numbers are not.</text>
<text x="52" y="776" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">In standalone mode this pin controls automatic standstill current</text>
<text x="52" y="804" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">reduction: about a second after the last step, the driver drops the</text>
<text x="52" y="832" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">coil current to roughly half. That is not a nicety here — it is the</text>
<text x="52" y="860" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">entire thermal contract, because the motor is sealed in a PLA drum and</text>
<text x="52" y="888" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="normal">holds current all day.</text>
<rect x="52" y="932" width="990" height="124" rx="6" fill="#fdf7ec" stroke="#b8791a" stroke-width="3"/>
<rect x="52" y="932" width="9" height="124" rx="0" fill="#b8791a" stroke="none" stroke-width="2"/>
<text x="80" y="964" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">THE POLARITY IS NOT VERIFIED for your module and this guide will not guess it. Leave PDN</text>
<text x="80" y="989" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">as the module ships for standalone, then confirm on page 28: with the motor energised</text>
<text x="80" y="1014" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">and still, the supply current must visibly STEP DOWN about a second after the last step.</text>
<text x="80" y="1039" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="bold">If it never does, tie the pin the other way and re-check.</text>
