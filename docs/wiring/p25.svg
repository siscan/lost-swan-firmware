<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131">
<rect width="1600" height="1131" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="88" fill="#eef1f4"/>
<line x1="0" y1="88" x2="1600" y2="88" stroke="#c7ced6" stroke-width="2"/>
<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Prove the Hall before you trust a home</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">Three checks, no motion, about two minutes</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">25 / 32</text>
<rect x="52" y="108" width="1496" height="76" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="108" width="9" height="76" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="140" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">ONE EVENING OF "THE SENSOR IS DEAD" IS ALWAYS A FLIPPED MAGNET. That is gotcha 2 in docs/ref/BOM.md and it has been there since</text>
<text x="80" y="166" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">the beginning. Check 2 below reads the glued magnet without touching it.</text>
<rect x="52" y="238" width="1000" height="160" rx="8" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<circle cx="92" cy="278" r="24" fill="#14181d" stroke="none" stroke-width="1"/>
<text x="92" y="286" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="132" y="286" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">The sensor is alive, and which face is its SOUTH</text>
<text x="132" y="320" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">Power the board. VM may be off. Type `hall`: with nothing near the sensor, column 0 reads</text>
<text x="132" y="343" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">raw=1 magnet=no. Now bring ONE FACE of a SPARE magnet up to the branded face. If it flips to</text>
<text x="132" y="366" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">magnet=YES, that face is the spare's SOUTH - mark it S with a pen, now. If not, turn the spare</text>
<text x="132" y="389" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">over; one of the two faces trips it.</text>
<rect x="52" y="414" width="1000" height="137" rx="8" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<circle cx="92" cy="454" r="24" fill="#14181d" stroke="none" stroke-width="1"/>
<text x="92" y="462" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="132" y="462" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">The GLUED magnet's outward face, without prising it out</text>
<text x="132" y="496" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">A magnet is its own polarity meter. Bring the spare's marked S face towards the glued magnet's</text>
<text x="132" y="519" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">exposed face. REPEL means the glued face is SOUTH and it will trip the sensor. ATTRACT means</text>
<text x="132" y="542" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">it is NORTH and it never will - the magnet is in backwards and has to be re-glued.</text>
<rect x="52" y="567" width="1000" height="137" rx="8" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<circle cx="92" cy="607" r="24" fill="#14181d" stroke="none" stroke-width="1"/>
<text x="92" y="615" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="132" y="615" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">Turn the drum by hand and watch</text>
<text x="132" y="649" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">`maint on` first, so nothing commands a move while your hands are on it. Turn the drum slowly</text>
<text x="132" y="672" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">through a full revolution with `hall` on screen. Once per revolution, and once only, column 0</text>
<text x="132" y="695" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">must read magnet=YES.</text>
<rect x="1088" y="252" width="460" height="268" rx="8" fill="#fafbfc" stroke="#14181d" stroke-width="3"/>
<text x="1318" y="292" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="middle" font-weight="bold">CHECK 2, IN ONE TABLE</text>
<line x1="1112" y1="308" x2="1524" y2="308" stroke="#c7ced6" stroke-width="2" stroke-linecap="round"/>
<text x="1112" y="344" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">spare's S face and</text>
<text x="1112" y="368" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="normal">the glued magnet...</text>
<text x="1112" y="420" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="22" fill="#1a7f45" text-anchor="start" font-weight="bold">REPEL</text>
<text x="1264" y="420" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#1a7f45" text-anchor="start" font-weight="bold">SOUTH  -  correct</text>
<text x="1112" y="476" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="22" fill="#c0261b" text-anchor="start" font-weight="bold">ATTRACT</text>
<text x="1264" y="476" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">NORTH  -  re-glue it</text>
<text x="1088" y="548" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">Like poles repel. A spare whose south face</text>
<text x="1088" y="569" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">pushes back is facing another south, and south</text>
<text x="1088" y="590" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">is what turns this part on.</text>
<text x="1088" y="648" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">A wide arc of magnet=YES means the gap is too</text>
<text x="1088" y="669" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">small or the magnet too strong for the bracket;</text>
<text x="1088" y="690" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">the firmware does not care, but the edge is</text>
<text x="1088" y="711" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">where a step count gets latched, so a narrow one</text>
<text x="1088" y="732" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">is worth having. Record the gap.</text>
<rect x="1088" y="742" width="300" height="40" rx="4" fill="none" stroke="#14181d" stroke-width="2"/>
<text x="1104" y="768" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">air gap  =  ______ mm</text>
<line x1="52" y1="1087" x2="1548" y2="1087" stroke="#c7ced6" stroke-width="1" stroke-linecap="round"/>
<text x="52" y="1111" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">LOST Swan  module V1  ·  generated by tools/wiringgen.py from hal/pins.h + docs/BENCH_WIRING.md</text>
</svg>