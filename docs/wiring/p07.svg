<text x="882" y="868" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" fill="#14181d" text-anchor="start" font-weight="bold">col D</text>
<text x="1064" y="572" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">3.  The aux pins: BEND, do not cut</text>
<text x="1064" y="606" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">The pins this build does not use - PDN/UART, CLK,</text>
<text x="1064" y="629" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">and the second GND - still have to go somewhere.</text>
<text x="1064" y="652" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">Bend them flat against the module body before you</text>
<text x="1064" y="675" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">seat it. Do NOT cut them: the module is one of six,</text>
<text x="1064" y="698" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">the other five may want UART later (spec 5.7a plan</text>
<text x="1064" y="721" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">B), and a cut pin cannot be put back. A bent pin</text>
<text x="1064" y="744" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#14181d" text-anchor="start" font-weight="normal">straightens with pliers in ten seconds.</text>
<rect x="1064" y="772" width="484" height="93" rx="6" fill="#fdf7ec" stroke="#b8791a" stroke-width="3"/>
<rect x="1064" y="772" width="9" height="93" rx="0" fill="#b8791a" stroke="none" stroke-width="2"/>
<text x="1092" y="804" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">A bent pin must not touch its neighbour or the</text>
<text x="1092" y="827" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">board. Check it before it goes in - once it is</text>
<text x="1092" y="850" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#b8791a" text-anchor="start" font-weight="bold">in, you cannot see it.</text>
<text x="1064" y="892" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">ROW AND COLUMN NUMBERS ARE LAYOUT, NOT CHECKED FACTS. The pins</text>
<text x="1064" y="910" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">on this page are parsed from hal/pins.h and BENCH_WIRING.md</text>
<text x="1064" y="928" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">and cross-checked; no source says which HOLE anything sits in,</text>
<text x="1064" y="946" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">so nothing verifies that. Build it elsewhere on the board and</text>
<text x="1064" y="964" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">the electrical pages are still true while these numbers are</text>
<text x="1064" y="982" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#6b7683" text-anchor="start" font-weight="normal">not.</text>
<line x1="52" y1="1087" x2="1548" y2="1087" stroke="#c7ced6" stroke-width="1" stroke-linecap="round"/>
