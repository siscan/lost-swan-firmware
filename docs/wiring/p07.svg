<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131">
<rect width="1600" height="1131" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="88" fill="#eef1f4"/>
<line x1="0" y1="88" x2="1600" y2="88" stroke="#c7ced6" stroke-width="2"/>
<text x="52" y="47" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="29" fill="#14181d" text-anchor="start" font-weight="bold">Which way up the driver goes</text>
<text x="52" y="74" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#6b7683" text-anchor="start" font-weight="normal">Measured on the real part - and it is not the way a StepStick diagram draws it</text>
<text x="1548" y="52" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="26" fill="#6b7683" text-anchor="end" font-weight="bold">7 / 29</text>
<rect x="52" y="108" width="1496" height="76" rx="6" fill="#fdf0ef" stroke="#c0261b" stroke-width="3"/>
<rect x="52" y="108" width="9" height="76" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="140" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">THE HEADER PINS EXIT THE COMPONENT FACE - the face with the Vref trimpot on it. So the module seats POT-DOWN, against the</text>
<text x="80" y="166" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#c0261b" text-anchor="start" font-weight="bold">breadboard. Two things follow, and the second one is the trap.</text>
<text x="52" y="246" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="21" fill="#14181d" text-anchor="start" font-weight="bold">1.  The pot is unreachable once the module is in</text>
<text x="52" y="280" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">It is pressed flat against the board. There is no setting it,</text>
<text x="52" y="305" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">checking it or correcting it without pulling the module back out</text>
<text x="52" y="330" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">- and pulling a module out of a live board is how they die. So</text>
<text x="52" y="355" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">VREF IS SET BEFORE INSERTION, with the driver lying on the bench</text>
<text x="52" y="380" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">on two flying leads. Page 24 is that procedure, and it is why</text>
<text x="52" y="405" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">that page comes before the module ever goes in.</text>
<text x="280" y="482" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="14" fill="#6b7683" text-anchor="middle" font-weight="normal">seen from the end</text>
<rect x="130" y="496" width="300" height="18" rx="3" fill="#3c6e47" stroke="#14181d" stroke-width="2"/>
<text x="280" y="509" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">PCB</text>
<circle cx="216" cy="480" r="15" fill="#dfe4ea" stroke="#14181d" stroke-width="2"/>
<line x1="206" y1="480" x2="226" y2="480" stroke="#14181d" stroke-width="4" stroke-linecap="round"/>
<text x="216" y="456" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="13" fill="#14181d" text-anchor="middle" font-weight="bold">pot</text>
<line x1="160" y1="494" x2="160" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<line x1="208" y1="494" x2="208" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<line x1="256" y1="494" x2="256" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<line x1="304" y1="494" x2="304" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<line x1="352" y1="494" x2="352" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<line x1="400" y1="494" x2="400" y2="456" stroke="#2b3138" stroke-width="6" stroke-linecap="round"/>
<text x="460" y="502" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">pins and pot on the SAME face</text>
<text x="460" y="526" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="15" fill="#6b7683" text-anchor="start" font-weight="normal">so the pot faces the board</text>
<text x="840" y="246" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="21" fill="#c0261b" text-anchor="start" font-weight="bold">2.  Left and right swap.  This is the trap.</text>
<text x="840" y="280" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">The silkscreen names its two headers as you read them</text>
<text x="840" y="305" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">component-side UP. Turning the module over exchanges them. The</text>
<text x="840" y="330" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">order ALONG each header does not change - EN is still at the</text>
<text x="840" y="355" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">same end - so every pin is exactly where you expect along the</text>
<text x="840" y="380" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">module and on the wrong side of it. A mirrored VM and GND is a</text>
<text x="840" y="405" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">reversed supply, and nothing on the board will tell you.</text>
<rect x="840" y="422" width="708" height="96" rx="6" fill="#eff8f2" stroke="#1a7f45" stroke-width="3"/>
<rect x="840" y="422" width="9" height="96" rx="0" fill="#1a7f45" stroke="none" stroke-width="2"/>
<text x="868" y="454" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#1a7f45" text-anchor="start" font-weight="bold">CHECK IT WITH THE METER, NOT WITH YOUR MEMORY: continuity from</text>
<text x="868" y="478" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#1a7f45" text-anchor="start" font-weight="bold">the driver's VM pin to row 26 column D. That single beep settles</text>
<text x="868" y="502" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#1a7f45" text-anchor="start" font-weight="bold">which way round it went in.</text>
<text x="52" y="572" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">Where each header actually lands</text>
