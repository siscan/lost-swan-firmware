<rect x="552" y="592" width="460" height="296" rx="6" fill="#fafbfc" stroke="#c7ced6" stroke-width="2"/>
<text x="570" y="624" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#6b7683" text-anchor="start" font-weight="bold">the silkscreen's RIGHT header</text>
