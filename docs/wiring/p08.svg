<text x="675" y="182" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="middle" font-weight="bold">DMM</text>
<text x="850" y="190" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">The wires were cut and re-terminated, so no colour</text>
<text x="850" y="216" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">convention is evidence any more. Measure all six</text>
<text x="850" y="242" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">combinations. Exactly two read low — those are the coils.</text>
<text x="850" y="268" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">The other four must read open.</text>
<text x="850" y="302" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">FIRST touch the probes together and note the reading</text>
<text x="850" y="326" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">(0.1-0.5 ohm). That is your test leads. Subtract it from</text>
<text x="850" y="350" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">everything below.</text>
<text x="866" y="390" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#14181d" text-anchor="start" font-weight="normal">red  -  blue</text>
