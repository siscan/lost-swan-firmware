<text x="878" y="656" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">Two low (about 1-2 ohm), four open. More than two low is a</text>
<text x="878" y="680" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">short — usually a stray strand on a Dupont pin. Any wire</text>
<text x="878" y="704" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">beeping to the motor CASE: stop, that winding is shorted to the</text>
<text x="878" y="728" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="16" fill="#c0261b" text-anchor="start" font-weight="bold">frame.</text>
<text x="52" y="620" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">CROSS-CHECK WITH NO METER: twist one candidate pair's bare ends together</text>
<text x="52" y="645" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">and turn the shaft. A real pair makes it noticeably harder and notchier</text>
<text x="52" y="670" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">to turn; a wrong pair turns freely. Ten seconds, and it catches mistakes</text>
<text x="52" y="695" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#14181d" text-anchor="start" font-weight="normal">a meter reading does not.</text>
<text x="52" y="754" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="19" fill="#14181d" text-anchor="start" font-weight="bold">Write it down — pages 24 and 25 refer to it:</text>
<text x="52" y="804" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">PAIR 1  =</text>
<line x1="196" y1="810" x2="620" y2="810" stroke="#14181d" stroke-width="2" stroke-linecap="round"/>
<text x="52" y="854" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#14181d" text-anchor="start" font-weight="bold">PAIR 2  =</text>
<line x1="196" y1="860" x2="620" y2="860" stroke="#14181d" stroke-width="2" stroke-linecap="round"/>
<text x="52" y="920" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">Expected for this motor: black+green one coil, red+blue the other. IF</text>
<text x="52" y="944" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#b8791a" text-anchor="start" font-weight="normal">YOUR METER DISAGREES, THE METER WINS.</text>
