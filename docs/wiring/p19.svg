<rect x="52" y="848" width="9" height="99" rx="0" fill="#c0261b" stroke="none" stroke-width="2"/>
<text x="80" y="880" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">ON A BREADBOARD THIS MEANS THE TWO HOLES BESIDE THE MODULE, not the power rails at the</text>
<text x="80" y="905" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">end of the board. Twenty centimetres of breadboard wire defeats the capacitor entirely.</text>
<text x="80" y="930" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="17" fill="#c0261b" text-anchor="start" font-weight="bold">This is the single thing breadboard builds get wrong.</text>
<text x="52" y="989" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="18" fill="#14181d" text-anchor="start" font-weight="bold">Concretely, on this build:</text>
